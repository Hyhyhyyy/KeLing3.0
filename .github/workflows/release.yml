name: Build Android preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x apps/android/gradlew
      - name: Test and build unsigned debug preview
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: keling-android-debug-preview
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Trusted releases intentionally remain disabled until the exposed historical signing
# identity is rotated and protected CI signing secrets are configured. See SECURITY.md.
