name: Build Android preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x apps/android/gradlew
      - name: Test and build unsigned debug preview
        working-directory: apps/android
        run: ./gradlew testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: keling-android-debug-preview
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

# Trusted releases intentionally remain disabled until the exposed historical signing
# identity is rotated and protected CI signing secrets are configured. See SECURITY.md.
