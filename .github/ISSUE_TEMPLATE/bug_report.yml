name: Bug report
description: Report a reproducible KeLing problem
title: "[Bug]: "
labels: [bug]
body:
  - type: dropdown
    id: client
    attributes:
      label: Affected component
      options: [Android, Web, Server, Sync/API, Build/Release]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide steps using a test account and synthetic content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed tokens, user data, databases, environment files, and signing material.
          required: true
